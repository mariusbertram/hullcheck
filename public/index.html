<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hullcheck &mdash; syft / grype / grant</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&#x1f6a2;</text></svg>" />
<link rel="stylesheet" href="/assets/style.css" />
</head>
<body>
<header class="topbar">
  <div class="brand">&#128666; Hullcheck</div>
</header>

<main>
  <section id="view-scan" class="view active">
    <form id="scan-form" class="card">
      <h2>Scan an image or OCI artifact</h2>
      <label>
        Image reference
        <input id="image-input" type="text" placeholder="registry.example.com/namespace/image:tag" required autocomplete="off" />
      </label>

      <details id="advanced-details">
        <summary>Advanced (one-off registry credentials / TLS)</summary>
        <div class="grid">
          <label>Registry host<input id="adv-authority" type="text" placeholder="registry.example.com" autocomplete="off" /></label>
          <label>Username<input id="adv-username" type="text" autocomplete="off" /></label>
          <label>Password / token<input id="adv-password" type="password" autocomplete="off" /></label>
          <label class="checkbox"><input id="adv-insecure-tls" type="checkbox" /> Skip TLS verification</label>
          <label class="checkbox"><input id="adv-insecure-http" type="checkbox" /> Use plain HTTP</label>
        </div>
      </details>

      <button type="submit" id="scan-submit">Scan with syft + grype + grant</button>
      <p class="hint">One-off credentials entered above are used for this scan only and are never persisted. Default registry credentials and proxy settings are configured outside the UI.</p>
    </form>

    <form id="lookup-form" class="card">
      <h2>View an existing scan</h2>
      <label>
        Scan ID
        <input id="lookup-id-input" type="text" placeholder="scan id" required autocomplete="off" />
      </label>
      <button type="submit" id="lookup-submit">Look up scan</button>
      <p id="lookup-error" class="hint hidden"></p>
    </form>

    <div id="scan-result" class="card hidden">
      <div class="result-header">
        <div>
          <h2 id="result-image"></h2>
          <span id="result-status" class="badge"></span>
          <span id="result-id" class="hint"></span>
        </div>
        <div id="tool-badges" class="tool-badges"></div>
      </div>

      <div class="result-tabs">
        <button class="rtab-btn active" data-rtab="log">Live log</button>
        <button class="rtab-btn" data-rtab="vulns">Vulnerabilities (grype)</button>
        <button class="rtab-btn" data-rtab="sbom">SBOM (syft)</button>
        <button class="rtab-btn" data-rtab="licenses">Licenses (grant)</button>
      </div>

      <div id="rtab-log" class="rtab active"><pre id="log-output" class="log"></pre></div>
      <div id="rtab-vulns" class="rtab"></div>
      <div id="rtab-sbom" class="rtab"></div>
      <div id="rtab-licenses" class="rtab"></div>
    </div>
  </section>
</main>

<script src="/assets/app.js"></script>
</body>
</html>

services:
  hullcheck:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/data
      - MAX_CONCURRENCY=2
      # - HTTP_PROXY=http://proxy.example.com:3128
      # - HTTPS_PROXY=http://proxy.example.com:3128
      # - NO_PROXY=localhost,127.0.0.1
    volumes:
      - hullcheck-data:/data
      # Optionally seed default registry credentials from a pre-built
      # ~/.docker/config.json-style secret:
      # - ./pull-secret.dockerconfigjson:/etc/hullcheck/pull-secret/.dockerconfigjson:ro

volumes:
  hullcheck-data:

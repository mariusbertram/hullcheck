name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: npm ci
        working-directory: server
        run: npm ci

      - name: npm test
        working-directory: server
        run: npm test

  dockerfile-lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning
          # DL3018: pin apk package versions - we intentionally track latest
          # ca-certificates/tzdata; tool versions are pinned separately via
          # build args (SYFT_VERSION/GRYPE_VERSION/GRANT_VERSION).
          ignore: DL3018

  manifests-lint:
    name: Lint Helm chart & kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: "v3.15.4"

      - name: helm lint
        run: helm lint charts/anchor-webui

      - name: helm template (default values)
        run: helm template anchor-webui charts/anchor-webui > /dev/null

      - name: helm template (route + persistence disabled)
        run: |
          helm template anchor-webui charts/anchor-webui \
            --set route.enabled=true \
            --set route.host=anchor-webui.apps.example.com \
            --set persistence.enabled=false \
            --set extraEmptyDirTmp=true \
            --set securityContext.readOnlyRootFilesystem=true > /dev/null

      - name: helm template (ingress + created pull secret)
        run: |
          helm template anchor-webui charts/anchor-webui \
            --set ingress.enabled=true \
            --set ingress.host=anchor-webui.example.com \
            --set pullSecret.create=true \
            --set-json 'pullSecret.dockerconfigjson="{\"auths\":{}}"' > /dev/null

      - name: kustomize build deploy/k8s
        run: kubectl kustomize deploy/k8s > /dev/null

  docker-build-test:
    name: Build image & smoke test a real scan
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (load into local docker daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: anchor-webui:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          docker run -d --name anchor-webui \
            -p 8080:8080 \
            -e MAX_CONCURRENCY=1 \
            -e TOOL_TIMEOUT_MS=300000 \
            anchor-webui:ci
          docker ps

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy in time"
          docker logs anchor-webui
          exit 1

      - name: syft / grype / grant are installed and runnable
        run: |
          docker exec anchor-webui syft version
          docker exec anchor-webui grype version
          docker exec anchor-webui grant version

      - name: Run a real scan through the API (syft + grype + grant)
        run: |
          set -euo pipefail
          job=$(curl -fsS -X POST http://127.0.0.1:8080/api/scans \
            -H 'Content-Type: application/json' \
            -d '{"image":"alpine:3.20"}')
          id=$(echo "$job" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).id))")
          echo "started scan $id"

          status=""
          for i in $(seq 1 90); do
            detail=$(curl -fsS "http://127.0.0.1:8080/api/scans/$id")
            status=$(echo "$detail" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).status))")
            if [ "$status" = "completed" ] || [ "$status" = "failed" ]; then
              echo "$detail" > /tmp/scan-detail.json
              break
            fi
            sleep 2
          done

          echo "final status: $status"
          node -e "
            const fs = require('fs');
            const job = JSON.parse(fs.readFileSync('/tmp/scan-detail.json', 'utf8'));
            console.log(JSON.stringify(job.tools, null, 2));
            for (const tool of ['syft', 'grype', 'grant']) {
              if (job.tools[tool].status !== 'success') {
                console.error(tool + ' did not succeed: ' + JSON.stringify(job.tools[tool]));
                process.exit(1);
              }
            }
            if (job.status !== 'completed') {
              console.error('job did not complete: ' + job.status);
              process.exit(1);
            }
          "

          echo "--- sbom.json / grype.json / grant.json are non-trivial JSON ---"
          for f in sbom grype grant; do
            curl -fsS "http://127.0.0.1:8080/api/scans/$id/artifacts/$f.json" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{ JSON.parse(d); });
            "
          done

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs anchor-webui || true

      - name: Stop container
        if: always()
        run: docker rm -f anchor-webui || true

  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    needs: [test, dockerfile-lint, manifests-lint, docker-build-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: CI

# Runs on every push to main and every pull request. Verifies the build,
# lints, and boots a real container to drive an actual scan through the
# HTTP API. Never pushes anything - that's release.yml's job, triggered
# only by a v* tag.

on:
  push:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "charts/**"
      - "deploy/**"
      - "public/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/lint.yml"
      - ".github/actions/**"
  pull_request:
    branches: ["main"]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "charts/**"
      - "deploy/**"
      - "public/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/lint.yml"
      - ".github/actions/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny all permissions by default; each job grants only what it needs.
permissions: {}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read

  test:
    name: Backend unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -shuffle=on ./...

  docker-build-test:
    name: Build image & smoke test a real scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [lint, test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (load into local docker daemon)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: hullcheck:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci

      - name: Start container
        run: |
          docker run -d --name hullcheck \
            -p 8080:8080 \
            -e MAX_CONCURRENCY=1 \
            -e TOOL_TIMEOUT_MS=300000 \
            hullcheck:ci
          docker ps

      - name: Wait for /healthz
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              echo "server is up"
              exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy in time"
          docker logs hullcheck
          exit 1

      - name: Wait for /readyz (vulnerability database download)
        run: |
          for i in $(seq 1 150); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "vulnerability database ready"
              exit 0
            fi
            sleep 2
          done
          echo "vulnerability database did not become ready in time"
          docker logs hullcheck
          exit 1

      - name: Run a real scan through the API (syft + grype, in-process)
        run: |
          set -euo pipefail
          job=$(curl -fsS -X POST http://127.0.0.1:8080/api/scans \
            -H 'Content-Type: application/json' \
            -d '{"image":"alpine:3.20"}')
          id=$(echo "$job" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).id))")
          echo "started scan $id"

          status=""
          for i in $(seq 1 90); do
            detail=$(curl -fsS "http://127.0.0.1:8080/api/scans/$id")
            status=$(echo "$detail" | node -e "process.stdin.on('data',d=>console.log(JSON.parse(d).status))")
            if [ "$status" = "completed" ] || [ "$status" = "failed" ]; then
              echo "$detail" > /tmp/scan-detail.json
              break
            fi
            sleep 2
          done

          echo "final status: $status"
          node -e "
            const fs = require('fs');
            const job = JSON.parse(fs.readFileSync('/tmp/scan-detail.json', 'utf8'));
            console.log(JSON.stringify(job.tools, null, 2));
            for (const tool of ['syft', 'grype', 'grant']) {
              if (job.tools[tool].status !== 'success') {
                console.error(tool + ' did not succeed: ' + JSON.stringify(job.tools[tool]));
                process.exit(1);
              }
            }
            if (job.status !== 'completed') {
              console.error('job did not complete: ' + job.status);
              process.exit(1);
            }
          "

          echo "--- sbom.json / grype.json / grant.json are non-trivial JSON ---"
          for f in sbom grype grant; do
            curl -fsS "http://127.0.0.1:8080/api/scans/$id/artifacts/$f.json" | node -e "
              let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{ JSON.parse(d); });
            "
          done

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs hullcheck || true

      - name: Stop container
        if: always()
        run: docker rm -f hullcheck || true

      # Report-only here (fail-build: false, attest: false): this image was
      # only built locally for verification and never pushed, so there's
      # nothing for cosign to attest against. Findings are printed to the
      # job log for visibility. The real, blocking gate is release.yml,
      # which scans the actual pushed multi-arch image before it's signed.
      - name: SBOM + vulnerability scan (report only)
        uses: ./.github/actions/sbom-scan-attest
        with:
          image-ref: hullcheck:ci
          artifact-name: hullcheck-ci
          attest: "false"
          fail-build: "false"

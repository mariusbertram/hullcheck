apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hullcheck
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  # hpa.yaml requires metrics-server in-cluster, and pvc.yaml requires an
  # RWX-capable StorageClass (see pvc.yaml). On a ReadWriteOnce-only
  # cluster, drop hpa.yaml and pin deployment.yaml's replicas to 1.
  # Uncomment the one matching your platform:
  # - route.yaml     # OpenShift
  # - ingress.yaml   # vanilla Kubernetes
  # Add your real pull secret separately, e.g.:
  # - pull-secret-example.yaml

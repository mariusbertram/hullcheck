apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hullcheck
  namespace: hullcheck
  labels:
    app.kubernetes.io/name: hullcheck
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hullcheck
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      # A running scan can take several minutes; don't remove a pod that
      # just finished one burst of CPU only to need it again shortly after,
      # and never scale down while a stream/scan might still be in flight.
      stabilizationWindowSeconds: 600
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60

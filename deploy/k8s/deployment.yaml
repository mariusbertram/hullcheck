apiVersion: apps/v1
kind: Deployment
metadata:
  name: anchor-webui
  namespace: anchor-webui
  labels:
    app.kubernetes.io/name: anchor-webui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: anchor-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anchor-webui
    spec:
      serviceAccountName: anchor-webui
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: anchor-webui
          # Build and push this image from the repository Dockerfile, then
          # point it here (see README.md).
          image: ghcr.io/example/anchor-webui:1.0.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: anchor-webui
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: pull-secret
              mountPath: /etc/anchor-webui/pull-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anchor-webui-data
        - name: pull-secret
          secret:
            secretName: anchor-webui-pull-secret
            optional: true

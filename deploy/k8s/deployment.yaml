apiVersion: apps/v1
kind: Deployment
metadata:
  name: hullcheck
  namespace: hullcheck
  labels:
    app.kubernetes.io/name: hullcheck
spec:
  # Managed by the HorizontalPodAutoscaler (hpa.yaml) once it's applied -
  # this is only the initial/fallback replica count.
  replicas: 2
  strategy:
    rollingUpdate:
      # Never drop below the current count while updating - a scan can run
      # for several minutes and streams a live SSE feed to the browser, so
      # old pods must stay serving until their replacements are ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hullcheck
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hullcheck
    spec:
      serviceAccountName: hullcheck
      # A scan (syft, then grype+grant) can run up to ~2x TOOL_TIMEOUT_MS
      # (default 15m each); give in-flight scans and their SSE streams room
      # to finish a graceful shutdown before kubelet SIGKILLs the process.
      terminationGracePeriodSeconds: 2100
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hullcheck
          # Build and push this image from the repository Dockerfile, then
          # point it here (see README.md).
          image: ghcr.io/example/hullcheck:0.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: hullcheck
          lifecycle:
            preStop:
              # Give kube-proxy/ingress time to remove this pod from
              # Endpoints before the app (which starts failing /readyz and
              # then receives SIGTERM right after this hook returns) stops
              # taking new connections.
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              # Sized so a single active scan (syft/grype/grant under
              # MAX_CONCURRENCY) doesn't immediately read as >100% CPU
              # utilization and pin the HPA at maxReplicas - utilization is
              # computed against requests, not limits.
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: pull-secret
              mountPath: /etc/hullcheck/pull-secret
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hullcheck-data
        - name: pull-secret
          secret:
            secretName: hullcheck-pull-secret
            optional: true

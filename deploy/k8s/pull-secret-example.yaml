# Example only - do not commit real credentials. Create with, e.g.:
#   kubectl -n anchor-webui create secret docker-registry anchor-webui-pull-secret \
#     --docker-server=registry.example.com \
#     --docker-username=USER \
#     --docker-password=PASSWORD
# and it will be picked up automatically by the Deployment below (mounted
# read-only, used as a default/base credential set - additional or
# overriding registries can still be added later from the Settings page).
apiVersion: v1
kind: Secret
metadata:
  name: anchor-webui-pull-secret
  namespace: anchor-webui
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: |
    {"auths":{"registry.example.com":{"username":"USER","password":"PASSWORD","auth":"BASE64(USER:PASSWORD)"}}}

{{- if .Values.pullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "anchor-webui.fullname" . }}-pull-secret
  labels:
    {{- include "anchor-webui.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.pullSecret.dockerconfigjson | b64enc }}
{{- end }}

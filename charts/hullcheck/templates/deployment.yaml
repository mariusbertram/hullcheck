apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hullcheck.fullname" . }}
  labels:
    {{- include "hullcheck.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    rollingUpdate:
      # Never drop below the current count while updating - a scan can run
      # for several minutes and streams a live SSE feed to the browser, so
      # old pods must stay serving until their replacements are ready.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "hullcheck.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hullcheck.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "hullcheck.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: hullcheck
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "hullcheck.fullname" . }}
          {{- with .Values.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              # Give kube-proxy/ingress time to remove this pod from
              # Endpoints before the app (which starts failing /readyz and
              # then receives SIGTERM right after this hook returns) stops
              # taking new connections.
              exec:
                command: ["sleep", "5"]
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if or .Values.pullSecret.existingSecret .Values.pullSecret.create }}
            - name: pull-secret
              mountPath: /etc/hullcheck/pull-secret
              readOnly: true
            {{- end }}
            {{- if .Values.extraEmptyDirTmp }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (printf "%s-data" (include "hullcheck.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if or .Values.pullSecret.existingSecret .Values.pullSecret.create }}
        - name: pull-secret
          secret:
            secretName: {{ .Values.pullSecret.existingSecret | default (printf "%s-pull-secret" (include "hullcheck.fullname" .)) }}
        {{- end }}
        {{- if .Values.extraEmptyDirTmp }}
        - name: tmp
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}

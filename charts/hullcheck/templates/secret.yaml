{{- if .Values.pullSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hullcheck.fullname" . }}-pull-secret
  labels:
    {{- include "hullcheck.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.pullSecret.dockerconfigjson | b64enc }}
{{- end }}

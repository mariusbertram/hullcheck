# Only used while autoscaling.enabled is false, or as the starting point
# before the HPA takes over. See autoscaling below.
replicaCount: 2

# A scan (syft, then grype+grant) can run up to ~2x TOOL_TIMEOUT_MS (default
# 15m each); give in-flight scans and their SSE streams room to finish a
# graceful shutdown before kubelet SIGKILLs the process.
terminationGracePeriodSeconds: 2100

image:
  repository: ghcr.io/example/hullcheck
  tag: ""       # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    # Sized so a single active scan (syft/grype/grant under MAX_CONCURRENCY)
    # doesn't immediately read as >100% CPU utilization and pin the HPA at
    # maxReplicas - utilization is computed against requests, not limits.
    cpu: "1"
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 2Gi

# Requires metrics-server in the cluster. HPA scaling requires
# persistence.accessMode: ReadWriteMany (below) since every replica must see
# the same scan history/data dir - on a ReadWriteOnce-only cluster, disable
# this and keep replicaCount: 1.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

# Works out of the box on both vanilla Kubernetes and OpenShift (restricted
# SCC assigns a random UID at runtime - the image is built group(0)-writable
# so it does not depend on runAsUser actually being honored).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: true
  runAsUser: 1001
  capabilities:
    drop: ["ALL"]
  readOnlyRootFilesystem: false

# Set to true (together with readOnlyRootFilesystem: true above) if your
# PodSecurityPolicy/PSA profile requires a read-only root filesystem - the
# scanners need a writable /tmp for per-scan credentials and staging files.
extraEmptyDirTmp: false

persistence:
  # Stores scan history/artifacts (SBOMs, vulnerability & license reports)
  # and the saved proxy/registry configuration across pod restarts.
  enabled: true
  # existingClaim: ""
  storageClassName: ""
  # ReadWriteMany because every replica mounts this same volume - scan
  # history and per-job logs must be visible to whichever pod a request
  # lands on, not just the one that ran the scan. Needs an RWX-capable
  # StorageClass (NFS, Longhorn, EFS, Azure Files, CephFS, ...). Set to
  # ReadWriteOnce only if replicaCount is 1 and autoscaling.enabled is
  # false.
  accessMode: ReadWriteMany
  size: 5Gi

config:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
  maxConcurrency: 2
  toolTimeoutSeconds: 900
  maxHistory: 200

# Extra container env vars beyond the fixed set above (standard
# name/value or name/valueFrom entries). Mainly for syft's own runtime env:
# GOLANG_SEARCH_REMOTE_LICENSES defaults to true (syft fetches Go module
# licenses from a Go proxy), so air-gapped/restricted clusters need either a
# GOPROXY pointed at an internal mirror, or GOLANG_SEARCH_REMOTE_LICENSES set
# to "false" to disable it outright (see README's "Air-gapped / offline
# deployment"):
#   extraEnv:
#     - name: GOPROXY
#       value: https://nexus.internal/repository/go-proxy
#     # or, with no proxy reachable at all:
#     # - name: GOLANG_SEARCH_REMOTE_LICENSES
#     #   value: "false"
extraEnv: []

# Seed default registry credentials (pull secrets) used by syft/grype/grant.
# Additional/override credentials can still be managed at runtime from the
# WebUI Settings page.
pullSecret:
  # Name of an existing Secret of type kubernetes.io/dockerconfigjson to
  # mount read-only, e.g. one already used as an imagePullSecret.
  existingSecret: ""
  # Alternatively let the chart create one from an inline .dockerconfigjson
  # value (prefer existingSecret / a secrets manager in production).
  create: false
  dockerconfigjson: ""

# OpenShift Route (used when running on OpenShift instead of ingress).
route:
  enabled: false
  host: ""
  tls:
    enabled: true
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tls: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  # OpenShift: leaving automountServiceAccountToken default is fine, the
  # app never talks to the Kubernetes API.
  automount: false

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
